<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PalPipeline - Palworld 2x2 Trait Solver</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151d30;
      --accent: #38bdf8;
      --accent-green: #4ade80;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #24334d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; line-height: 1.5; }
    
    .brand { text-align: center; margin-bottom: 20px; }
    .brand h1 { font-size: 1.8rem; letter-spacing: -0.025em; color: var(--text); }
    .brand h1 span { color: var(--accent); }
    .subtitle { color: var(--text-dim); font-size: 0.85rem; margin-top: 2px; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); margin-bottom: 6px; }
    select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #0b0f19; color: var(--text); font-size: 1rem; margin-bottom: 14px; }
    
    button.calc-btn { width: 100%; background: var(--accent); color: #0b0f19; border: none; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
    button.calc-btn:active { opacity: 0.8; }

    .route-card { background: #0b0f19; border-left: 4px solid var(--accent); padding: 12px; border-radius: 6px; margin-bottom: 10px; }
    .line-title { font-weight: 700; color: var(--accent); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .step-text { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 6px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
    
    /* Pal Clickable Button Style */
    .pal-link {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }
    .pal-link:hover, .pal-link:active {
      border-color: var(--accent);
      color: var(--accent);
    }
    .pal-link.highlight { border-color: #f43f5e; color: #f43f5e; }
    .pal-link.target-highlight { border-color: var(--accent-green); color: var(--accent-green); }

    /* Modal Image Popup Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 300px;
      text-align: center;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin: 12px auto;
      display: block;
      background: #0b0f19;
      border-radius: 12px;
      padding: 8px;
      border: 1px solid var(--border);
    }
    .modal-title { font-size: 1.2rem; font-weight: 700; color: var(--text); }
    .modal-info { font-size: 0.85rem; color: var(--text-dim); margin-top: 4px; }
    .close-btn {
      position: absolute;
      top: 10px; right: 14px;
      background: none; border: none;
      color: var(--text-dim); font-size: 1.4rem;
      font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="brand">
    <h1>Pal<span>Pipeline</span></h1>
    <p class="subtitle">Multi-Step 2x2 Trait Isolation & Cross-Breeding Engine</p>
  </div>

  <div class="card">
    <label for="startA">Line A Parent (Traits 1 & 2)</label>
    <select id="startA"></select>

    <label for="startB">Line B Parent (Traits 3 & 4)</label>
    <select id="startB"></select>

    <label for="targetPal">Target Pal (Final Goal)</label>
    <select id="targetPal"></select>

    <label for="maxDepth">Max Chain Depth (Safety Cap)</label>
    <select id="maxDepth">
      <option value="2">2 Steps Max</option>
      <option value="3">3 Steps Max</option>
      <option value="4" selected>4 Steps Max (Recommended)</option>
      <option value="6">6 Steps Max</option>
    </select>

    <button class="calc-btn" onclick="calculateRoutes()">Build Multi-Step Pipeline</button>
  </div>

  <div id="results"></div>

  <div id="palModal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div id="modalTitle" class="modal-title">Pal Name</div>
      <img id="modalImg" class="modal-img" src="" alt="Pal Image" />
      <div id="modalInfo" class="modal-info">Breeding Power: 570</div>
    </div>
  </div>

      { name: "Tombat", power: 870 },

      { name: "Univolt", power: 680 },
      { name: "Vanwyrm", power: 660 },
      { name: "Vanwyrm Cryst", power: 650 },
      { name: "Verdash", power: 610 },
      { name: "Vaelet", power: 820 },
      { name: "Vixy", power: 1450 },
      { name: "Warsect", power: 340 },
      { name: "Wumpo", power: 430 },
      { name: "Wumpo Botan", power: 420 },
      { name: "Woolipop", power: 1170 },
      { name: "Wixen", power: 1140 },
      { name: "Wixen Noct", power: 1135 },
      { name: "Yakumo", power: 920 }
    ].sort((a, b) => a.name.localeCompare(b.name));

    const SPECIAL_COMBOS = {
      "Frostallion + Helzephyr": "Frostallion Noct",
      "Relaxaurus + Sparkit": "Relaxaurus Lux",
      "Elphidran + Surfent": "Elphidran Aqua",
      "Mossanda + Grizzbolt": "Mossanda Lux",
      "Eikthyrdeer + Hangyu": "Eikthyrdeer Terra",
      "Incineram + Maraith": "Incineram Noct",
      "Jolthog + Pengullet": "Jolthog Cryst",
      "Lyleen + Mossanda": "Lyleen Noct",
      "Pyrin + Katress": "Pyrin Noct",
      "Reptyro + Foxcicle": "Ice Reptyro",
      "Robinquill + Faleris": "Robinquill Terra",
      "Katress + Wixen": "Katress Ignis",
      "Chillet + Goblean": "Chillet Ignis",
      "Quivern + Dinossom": "Quivern Botan",
      "Bushi + Arsox": "Bushi Noct",
      "Gorirat + Digtoise": "Gorirat Terra"
    };

    function populateSelects() {
      const selects = ['startA', 'startB', 'targetPal'];
      selects.forEach(id => {
        const select = document.getElementById(id);
        select.innerHTML = "";
        PALDEX.forEach(pal => {
          const opt = document.createElement('option');
          opt.value = pal.name;
          opt.textContent = `${pal.name} (Power: ${pal.power})`;
          select.appendChild(opt);
        });
      });

      document.getElementById('startA').value = "Relaxaurus";
      document.getElementById('startB').value = "Celaray";
      document.getElementById('targetPal').value = "Anubis";
    }

    function getOffspring(pA, pB) {
      if (pA.name === pB.name) return pA;

      const key1 = `${pA.name} + ${pB.name}`;
      const key2 = `${pB.name} + ${pA.name}`;
      if (SPECIAL_COMBOS[key1]) return PALDEX.find(p => p.name === SPECIAL_COMBOS[key1]) || pA;
      if (SPECIAL_COMBOS[key2]) return PALDEX.find(p => p.name === SPECIAL_COMBOS[key2]) || pA;

      const targetPower = Math.floor((pA.power + pB.power + 1) / 2);
      let closest = PALDEX[0];
      let minDiff = Math.abs(PALDEX[0].power - targetPower);

      for (const pal of PALDEX) {
        const diff = Math.abs(pal.power - targetPower);
        if (diff < minDiff) {
          minDiff = diff;
          closest = pal;
        }
      }
      return closest;
    }

    function findChains(startPal, maxDepth) {
      let paths = {};
      let queue = [{ pal: startPal, steps: [] }];
      paths[startPal.name] = [];

      while (queue.length > 0) {
        let { pal, steps } = queue.shift();

        if (steps.length >= maxDepth) continue;

        for (let wild of PALDEX) {
          let child = getOffspring(pal, wild);
          let newSteps = [...steps, { parent: pal, filler: wild, result: child }];

          if (!paths[child.name] || newSteps.length < paths[child.name].length) {
            paths[child.name] = newSteps;
            queue.push({ pal: child, steps: newSteps });
          }
        }
      }
      return paths;
    }

    // Helper function to render a clickable Pal button
    function renderPalLink(palName, extraClass = "") {
      return `<button class="pal-link ${extraClass}" onclick="openPalModal('${palName}')">🔍 ${palName}</button>`;
    }

    // Image Popup Handler
    function openPalModal(palName) {
      const pal = PALDEX.find(p => p.name === palName);
      if (!pal) return;

      // Clean Pal name for Wiki Image URL format
      const formattedName = palName.replace(/ /g, "_");
      const imgUrl = `https://static.wikia.nocookie.net/palworld/images/thumb/${formattedName}.png/200px-${formattedName}.png`;

      document.getElementById('modalTitle').textContent = pal.name;
      document.getElementById('modalInfo').textContent = `Breeding Power: ${pal.power}`;
      
      const imgElem = document.getElementById('modalImg');
      imgElem.src = imgUrl;
      imgElem.onerror = () => {
        // Fallback image if CDN thumb fails
        imgElem.src = "https://raw.githubusercontent.com/fandom/palworld-wiki/main/icon.png";
      };

      document.getElementById('palModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('palModal').style.display = 'none';
    }

    function calculateRoutes() {
      const nameA = document.getElementById('startA').value;
      const nameB = document.getElementById('startB').value;
      const nameTarget = document.getElementById('targetPal').value;
      const maxDepth = parseInt(document.getElementById('maxDepth').value);

      const palA = PALDEX.find(p => p.name === nameA);
      const palB = PALDEX.find(p => p.name === nameB);
      const target = PALDEX.find(p => p.name === nameTarget);

      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = `<div class="card"><p style="color:var(--text-dim); font-size:0.9rem;">Searching multi-step graph paths...</p></div>`;

      setTimeout(() => {
        let chainsA = findChains(palA, maxDepth);
        let chainsB = findChains(palB, maxDepth);

        let validPipelines = [];

        for (let interA_Name in chainsA) {
          for (let interB_Name in chainsB) {
            let interA_Pal = PALDEX.find(p => p.name === interA_Name);
            let interB_Pal = PALDEX.find(p => p.name === interB_Name);

            let finalChild = getOffspring(interA_Pal, interB_Pal);

            if (finalChild.name === target.name) {
              validPipelines.push({
                lineA_Steps: chainsA[interA_Name],
                lineB_Steps: chainsB[interB_Name],
                finalA: interA_Pal,
                finalB: interB_Pal,
                totalSteps: chainsA[interA_Name].length + chainsB[interB_Name].length + 1
              });
            }
          }
        }

        validPipelines.sort((a, b) => a.totalSteps - b.totalSteps);

        if (validPipelines.length === 0) {
          resultsDiv.innerHTML = `<div class="card"><p style="color:var(--text-dim); font-size:0.9rem;">No pipelines found within ${maxDepth} steps. Try increasing max depth cap.</p></div>`;
          return;
        }

        resultsDiv.innerHTML = `<h2 style="font-size:1rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-dim); margin-bottom:12px;">Found ${validPipelines.length} Available Multi-Step Pipelines</h2>`;

        validPipelines.slice(0, 5).forEach((p) => {
          const card = document.createElement('div');
          card.className = 'card';

          let lineAHTML = p.lineA_Steps.length === 0 
            ? `<div class="step-text">Use ${renderPalLink(palA.name)} directly (0 steps)</div>`
            : p.lineA_Steps.map(s => `<div class="step-text">${renderPalLink(s.parent.name)} × ${renderPalLink(s.filler.name, 'highlight')} (Clean) ➔ ${renderPalLink(s.result.name)}</div>`).join('');

          let lineBHTML = p.lineB_Steps.length === 0 
            ? `<div class="step-text">Use ${renderPalLink(palB.name)} directly (0 steps)</div>`
            : p.lineB_Steps.map(s => `<div class="step-text">${renderPalLink(s.parent.name)} × ${renderPalLink(s.filler.name, 'highlight')} (Clean) ➔ ${renderPalLink(s.result.name)}</div>`).join('');

          card.innerHTML = `
            <div class="route-card">
              <div class="line-title">Line A Steps (Isolate Traits 1 & 2)</div>
              ${lineAHTML}
            </div>
            <div class="route-card">
              <div class="line-title">Line B Steps (Isolate Traits 3 & 4)</div>
              ${lineBHTML}
            </div>
            <div class="route-card" style="border-left-color: var(--accent-green);">
              <div class="line-title" style="color: var(--accent-green);">Final Cross (Combine All 4 Traits)</div>
              <div class="step-text">${renderPalLink(p.finalA.name)} × ${renderPalLink(p.finalB.name)} ➔ ${renderPalLink(target.name, 'target-highlight')}</div>
            </div>
          `;
          resultsDiv.appendChild(card);
        });
      }, 50);
    }

    window.onload = populateSelects;
  </script>
</body>
</html>

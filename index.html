<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PalPipeline - Palworld 2x2 Trait Solver</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151d30;
      --accent: #38bdf8;
      --accent-green: #4ade80;
      --accent-red: #f43f5e;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: #24334d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; line-height: 1.5; }
    
    .brand { text-align: center; margin-bottom: 20px; }
    .brand h1 { font-size: 1.8rem; letter-spacing: -0.025em; color: var(--text); }
    .brand h1 span { color: var(--accent); }
    .subtitle { color: var(--text-dim); font-size: 0.85rem; margin-top: 2px; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); margin-bottom: 6px; }
    select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #0b0f19; color: var(--text); font-size: 1rem; margin-bottom: 14px; }
    
    button.calc-btn { width: 100%; background: var(--accent); color: #0b0f19; border: none; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
    button.calc-btn:active { opacity: 0.8; }

    /* Excluded Chips Bar */
    .exclude-box { margin-bottom: 14px; }
    .chip-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; min-height: 24px; }
    .chip {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid var(--accent-red);
      color: #fca5a5;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .chip-remove { cursor: pointer; font-weight: bold; font-size: 1rem; line-height: 1; }
    .chip-remove:hover { color: #fff; }

    .route-card { background: #0b0f19; border-left: 4px solid var(--accent); padding: 12px; border-radius: 6px; margin-bottom: 10px; }
    .line-title { font-weight: 700; color: var(--accent); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .step-text { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 6px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
    
    .pal-link {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }
    .pal-link:hover, .pal-link:active {
      border-color: var(--accent);
      color: var(--accent);
    }
    .pal-link.highlight { border-color: #f43f5e; color: #f43f5e; }
    .pal-link.target-highlight { border-color: var(--accent-green); color: var(--accent-green); }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 300px;
      text-align: center;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-avatar {
      width: 80px;
      height: 80px;
      margin: 12px auto;
      border-radius: 50%;
      background: var(--accent);
      color: #0b0f19;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
    }
    .modal-title { font-size: 1.2rem; font-weight: 700; color: var(--text); }
    .modal-info { font-size: 0.85rem; color: var(--text-dim); margin-top: 4px; }
    
    .modal-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    
    .action-btn {
      display: block;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .action-btn.wiki { background: #1e293b; color: var(--accent); border-color: var(--accent); }
    .action-btn.exclude { background: rgba(244, 63, 94, 0.15); color: var(--accent-red); border-color: var(--accent-red); }
    .action-btn.exclude:active { background: var(--accent-red); color: #fff; }

    .close-btn {
      position: absolute;
      top: 10px; right: 14px;
      background: none; border: none;
      color: var(--text-dim); font-size: 1.4rem;
      font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="brand">
    <h1>Pal<span>Pipeline</span></h1>
    <p class="subtitle">Multi-Step 2x2 Trait Isolation & Cross-Breeding Engine</p>
  </div>

  <div class="card">

    <label for="targetPal">Target Pal (Final Goal)</label>

    <label for="maxDepth">Max Chain Depth (Safety Cap)</label>
    <select id="maxDepth">
      <option value="2">2 Steps Max</option>
      <option value="3">3 Steps Max</option>
      <option value="4" selected>4 Steps Max (Recommended)</option>
      <option value="6">6 Steps Max</option>
    </select>

    <div class="exclude-box">
      <label>Add Pal To Exclude List</label>
      <select id="excludeSelect" onchange="manualExclude(this.value)">
        <option value="">-- Select Pal to Exclude --</option>
      </select>
      
      <div id="chipContainer" class="chip-container"></div>
    </div>

    <button class="calc-btn" onclick="calculateRoutes()">Build Multi-Step Pipeline</button>
  </div>

  <div id="results"></div>

      // Base Game Fusion & Unique Combos

    let excludedPals = new Set();

    function populateSelects() {
      const selects = ['startA', 'startB', 'targetPal', 'excludeSelect'];
      selects.forEach(id => {
        const select = document.getElementById(id);
        if (id !== 'excludeSelect') select.innerHTML = "";
        PALDEX.forEach(pal => {
          const opt = document.createElement('option');
          opt.value = pal.name;
          opt.textContent = `${pal.name} (${pal.power})`;
          select.appendChild(opt);
        });
      });

      document.getElementById('startA').value = "Relaxaurus";
      document.getElementById('startB').value = "Celaray";
      document.getElementById('targetPal').value = "Anubis";
    }

    function addExclusion(palName) {
      if (!palName || excludedPals.has(palName)) return;
      excludedPals.add(palName);
      renderExclusionChips();
      calculateRoutes();
    }

    function removeExclusion(palName) {
      excludedPals.delete(palName);
      renderExclusionChips();
      calculateRoutes();
    }

    function manualExclude(palName) {
      if (palName) {
        addExclusion(palName);
        document.getElementById('excludeSelect').value = "";
      }
    }

    function renderExclusionChips() {
      const container = document.getElementById('chipContainer');
      container.innerHTML = "";
      excludedPals.forEach(name => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.innerHTML = `${name} <span class="chip-remove" onclick="removeExclusion('${name}')">&times;</span>`;
        container.appendChild(chip);
      });
    }

    function getOffspring(pA, pB) {
      if (pA.name === pB.name) return pA;

      const key1 = `${pA.name} + ${pB.name}`;
      const key2 = `${pB.name} + ${pA.name}`;
      if (SPECIAL_COMBOS[key1]) return PALDEX.find(p => p.name === SPECIAL_COMBOS[key1]) || pA;
      if (SPECIAL_COMBOS[key2]) return PALDEX.find(p => p.name === SPECIAL_COMBOS[key2]) || pA;

      const targetPower = Math.floor((pA.power + pB.power + 1) / 2);
      
      let closestPal = PALDEX[0];
      let minDiff = Math.abs(PALDEX[0].power - targetPower);

      for (const pal of PALDEX) {
        const diff = Math.abs(pal.power - targetPower);
        
        if (diff < minDiff || (diff === minDiff && pal.power < closestPal.power)) {
          minDiff = diff;
          closestPal = pal;
        }
      }
      return closestPal;
    }

    function findChains(startPal, maxDepth) {
      let paths = {};
      let queue = [{ pal: startPal, steps: [] }];
      paths[startPal.name] = [];

      while (queue.length > 0) {
        let { pal, steps } = queue.shift();

        if (steps.length >= maxDepth) continue;

        for (let wild of PALDEX) {
          if (excludedPals.has(wild.name)) continue;

          let child = getOffspring(pal, wild);
          if (excludedPals.has(child.name)) continue;

          let newSteps = [...steps, { parent: pal, filler: wild, result: child }];

          if (!paths[child.name] || newSteps.length < paths[child.name].length) {
            paths[child.name] = newSteps;
            queue.push({ pal: child, steps: newSteps });
          }
        }
      }
      return paths;
    }

    function renderPalLink(palObj, extraClass = "") {
      const pal = typeof palObj === "string" ? PALDEX.find(p => p.name === palObj) : palObj;
      if (!pal) return palObj;
      return `<button class="pal-link ${extraClass}" onclick="openPalModal('${pal.name}')">${pal.name} (${pal.power})</button>`;
    }

    function openPalModal(palName) {
      const pal = PALDEX.find(p => p.name === palName);
      if (!pal) return;

      currentActivePalName = palName;

      document.getElementById('modalTitle').textContent = pal.name;
      document.getElementById('modalInfo').textContent = `Paldex #${pal.id} • Breeding Power: ${pal.power}`;
      document.getElementById('modalAvatar').textContent = pal.name.charAt(0);
      
      const wikiUrl = `https://palworld.fandom.com/wiki/${pal.name.replace(/ /g, '_')}`;
      document.getElementById('wikiLink').href = wikiUrl;

      document.getElementById('palModal').style.display = 'flex';
    }

    function excludeCurrentPal() {
      if (currentActivePalName) {
        addExclusion(currentActivePalName);
        closeModal();
      }
    }

    function closeModal() {
      document.getElementById('palModal').style.display = 'none';
    }

    function calculateRoutes() {
      const nameA = document.getElementById('startA').value;
      const nameB = document.getElementById('startB').value;
      const nameTarget = document.getElementById('targetPal').value;
      const maxDepth = parseInt(document.getElementById('maxDepth').value);

      const palA = PALDEX.find(p => p.name === nameA);
      const palB = PALDEX.find(p => p.name === nameB);
      const target = PALDEX.find(p => p.name === nameTarget);

      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = `<div class="card"><p style="color:var(--text-dim); font-size:0.9rem;">Searching multi-step graph paths...</p></div>`;

      setTimeout(() => {
        let chainsA = findChains(palA, maxDepth);
        let chainsB = findChains(palB, maxDepth);

        let validPipelines = [];

        for (let interA_Name in chainsA) {
          for (let interB_Name in chainsB) {
            let interA_Pal = PALDEX.find(p => p.name === interA_Name);
            let interB_Pal = PALDEX.find(p => p.name === interB_Name);

            let finalChild = getOffspring(interA_Pal, interB_Pal);

            if (finalChild.name === target.name) {
              validPipelines.push({
                lineA_Steps: chainsA[interA_Name],
                lineB_Steps: chainsB[interB_Name],
                finalA: interA_Pal,
                finalB: interB_Pal,
                totalSteps: chainsA[interA_Name].length + chainsB[interB_Name].length + 1
              });
            }
          }
        }

        validPipelines.sort((a, b) => a.totalSteps - b.totalSteps);

        if (validPipelines.length === 0) {
          resultsDiv.innerHTML = `<div class="card"><p style="color:var(--text-dim); font-size:0.9rem;">No pipelines found within ${maxDepth} steps using current filter/exclusion settings.</p></div>`;
          return;
        }

        resultsDiv.innerHTML = `<h2 style="font-size:1rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-dim); margin-bottom:12px;">Found ${validPipelines.length} Available Multi-Step Pipelines</h2>`;

        validPipelines.slice(0, 5).forEach((p) => {
          const card = document.createElement('div');
          card.className = 'card';

          let lineAHTML = p.lineA_Steps.length === 0 
            ? `<div class="step-text">Use ${renderPalLink(palA)} directly (0 steps)</div>`
            : p.lineA_Steps.map(s => `<div class="step-text">${renderPalLink(s.parent)} × ${renderPalLink(s.filler, 'highlight')} (Clean) ➔ ${renderPalLink(s.result)}</div>`).join('');

          let lineBHTML = p.lineB_Steps.length === 0 
            ? `<div class="step-text">Use ${renderPalLink(palB)} directly (0 steps)</div>`
            : p.lineB_Steps.map(s => `<div class="step-text">${renderPalLink(s.parent)} × ${renderPalLink(s.filler, 'highlight')} (Clean) ➔ ${renderPalLink(s.result)}</div>`).join('');

          card.innerHTML = `
            <div class="route-card">
              <div class="line-title">Line A Steps (Isolate Traits 1 & 2)</div>
              ${lineAHTML}
            </div>
            <div class="route-card">
              <div class="line-title">Line B Steps (Isolate Traits 3 & 4)</div>
              ${lineBHTML}
            </div>
            <div class="route-card" style="border-left-color: var(--accent-green);">
              <div class="line-title" style="color: var(--accent-green);">Final Cross (Combine All 4 Traits)</div>
              <div class="step-text">${renderPalLink(p.finalA)} × ${renderPalLink(p.finalB)} ➔ ${renderPalLink(target, 'target-highlight')}</div>
            </div>
          `;
          resultsDiv.appendChild(card);
        });
      }, 50);
    }

    window.onload = populateSelects;
  </script>
</body>
</html>
